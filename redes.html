<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guns N' Roses — Social & Discography</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header__content">
            <h1 class="logo">Guns'n Roses</h1>

            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="buy.html">Buy</a></li>
                    <li><a href="#social">Social</a></li>
                    <li><a href="#albums">Albums</a></li>
                </ul>
            </nav>

            <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        </div>
    </header>

    <main>

        <!-- Social Links -->
        <section id="social">
            <h2>Follow Us</h2>
            <div class="redes container">
                <section id="insta">
                    <div>
                        <a href="https://instagram.com/gunsnroses" class="btn" target="_blank" rel="noopener">Instagram</a>
                    </div>
                </section>

                <section id="spot">
                    <div>
                        <a href="https://open.spotify.com/artist/3qm84nBOXUEQ2vnTfUTTFC" class="btn" target="_blank" rel="noopener">Spotify</a>
                    </div>
                </section>

                <section id="you">
                    <div>
                        <a href="https://www.youtube.com/channel/UCIak6JLVOjqhStxrL1Lcytw" class="btn" target="_blank" rel="noopener">YouTube</a>
                    </div>
                </section>
            </div>
        </section>

        <!-- Album Cards -->
        <section id="albums" class="albums-section container">
            <h2>Discography</h2>
            <div class="albums-grid">

                <div class="album-card">
                    <div class="album-card__cover-placeholder"><img src="/img/can1.jpeg" alt=""></div>
                    <div class="album-card__info">
                        <p class="album-card__title">Appetite for Destruction</p>
                        <p class="album-card__year">1987</p>
                    </div>
                </div>

                <div class="album-card">
                    <div class="album-card__cover-placeholder"><img src="/img/can2.jpeg" alt=""></div>
                    <div class="album-card__info">
                        <p class="album-card__title">Use Your Illusion </p>
                        <p class="album-card__year">1991</p>
                    </div>
                </div>
                
                <div class="album-card">
                    <div class="album-card__cover-placeholder"><img src="img/can7.jpeg" alt=""></div>
                    <div class="album-card__info">
                        <p class="album-card__title">Right next door to hell</p>
                        <p class="album-card__year">20219</p>
                    </div>
                </div>

                <div class="album-card">
                    <div class="album-card__cover-placeholder"><img src="img/can8.jpeg" alt=""></div>
                    <div class="album-card__info">
                        <p class="album-card__title">live radio broadcast</p>
                        <p class="album-card__year">2019</p>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer id="contact" class="footer">
        <div class="container footer__content">
            <p>© Guns'n Roses</p>

            <ul class="social">
                <li><a href="redes.html">Instagram</a></li>
                <li><a href="redes.html">Spotify</a></li>
                <li><a href="redes.html">YouTube</a></li>
                <li><a href="buy.html">Buy tickets</a></li>
            </ul>
        </div>
    </footer>

    <script src="script/main.js"></script>
</body>
</html>
