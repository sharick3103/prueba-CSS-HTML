<body>
        <header class="header">
        <div class="container header__content">
            <h1 class="logo"> <img src="/img/logo (1).jpg (1).jpg" alt="">Guns'n Roses</h1>
    


            <nav class="nav">

    </header>

    <main>
        
        <section id="contact">
            <h2>Contact</h2>
            <form action="" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="Buy">How many tickets do you want to buy?</label>
                <input type="number" name="Buy" id="ticket" placeholder="example: 1">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="youremail@example.com" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Write your message..."></textarea>

                <button type="submit" class="btn">Send message</button>

            </form>
        </section>

    <footer id="contact" class="footer">
        <div class="container footer__content">
            <p>© Guns'n Roses</p>

          
            <ul class="social">
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Spotify</a></li>
                <li><a href="#">YouTube</a></li>
            </ul>
        </div>
    </footer>

    </main>
